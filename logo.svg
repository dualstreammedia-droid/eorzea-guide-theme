<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="エオルゼア攻略ガイド">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Shippori+Mincho:wght@500;700&display=swap');
      .title { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-weight: 900; font-size: 68px; }
      .sub   { font-family: 'Shippori Mincho', 'Noto Serif JP', serif; font-weight: 600; font-size: 22px; letter-spacing: 0.42em; }
    ]]></style>
    <linearGradient id="g-gold-crystal" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%"   stop-color="#f5d878"/>
      <stop offset="35%"  stop-color="#f0d68e"/>
      <stop offset="55%"  stop-color="#d8c5a0"/>
      <stop offset="75%"  stop-color="#a8c8dc"/>
      <stop offset="100%" stop-color="#7eb8d4"/>
    </linearGradient>
    <linearGradient id="g-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(245,216,120,0)"/>
      <stop offset="20%"  stop-color="rgba(240,214,142,0.8)"/>
      <stop offset="50%"  stop-color="rgba(216,197,160,1)"/>
      <stop offset="80%"  stop-color="rgba(126,184,212,0.8)"/>
      <stop offset="100%" stop-color="rgba(126,184,212,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 上下ライン -->
  <line x1="80" y1="36" x2="820" y2="36" stroke="url(#g-line)" stroke-width="1.5"/>
  <line x1="80" y1="178" x2="820" y2="178" stroke="url(#g-line)" stroke-width="1.5"/>

  <!-- 端の装飾点 -->
  <circle cx="80" cy="36" r="2" fill="#f5d878"/>
  <circle cx="820" cy="36" r="2" fill="#7eb8d4"/>
  <circle cx="80" cy="178" r="2" fill="#f5d878"/>
  <circle cx="820" cy="178" r="2" fill="#7eb8d4"/>

  <!-- 上の中央クリスタル装飾 -->
  <g transform="translate(450, 28)" fill="url(#g-gold-crystal)" filter="url(#glow)">
    <polygon points="0,-10 7,-2 5,8 -5,8 -7,-2"/>
    <polygon points="0,-10 7,-2 0,0" fill="#ffe9b5" opacity="0.6"/>
  </g>

  <!-- 下の中央クリスタル装飾（小） -->
  <g transform="translate(450, 186)" fill="url(#g-gold-crystal)">
    <polygon points="0,-6 4,-1 3,5 -3,5 -4,-1"/>
  </g>

  <!-- メインタイトル EORZEA -->
  <text x="450" y="118" text-anchor="middle" class="title" fill="url(#g-gold-crystal)" letter-spacing="0.12em" filter="url(#glow)">EORZEA</text>

  <!-- 装飾セパレータ ✦ -->
  <text x="320" y="155" text-anchor="middle" font-size="14" fill="#d8c5a0" opacity="0.7">✦</text>
  <text x="580" y="155" text-anchor="middle" font-size="14" fill="#d8c5a0" opacity="0.7">✦</text>

  <!-- サブタイトル日本語 -->
  <text x="450" y="158" text-anchor="middle" class="sub" fill="#e8d4a0">攻 略 ガ イ ド</text>
</svg>
