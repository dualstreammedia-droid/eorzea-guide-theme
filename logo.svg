<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="エオルゼア攻略ガイド">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@500;700&family=Shippori+Mincho:wght@500;700&display=swap');
      .title    { font-family: 'Cinzel Decorative', 'Cinzel', serif; font-weight: 900; font-size: 84px; }
      .sub-ja   { font-family: 'Shippori Mincho', 'Noto Serif JP', serif; font-weight: 600; font-size: 26px; letter-spacing: 0.55em; }
      .sub-en   { font-family: 'Cinzel', serif; font-weight: 500; font-size: 17px; letter-spacing: 0.25em; }
    ]]></style>
    <linearGradient id="g-text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff5d1"/>
      <stop offset="35%"  stop-color="#f5d878"/>
      <stop offset="55%"  stop-color="#e8c478"/>
      <stop offset="75%"  stop-color="#b8d0e8"/>
      <stop offset="100%" stop-color="#7eb8d4"/>
    </linearGradient>
    <linearGradient id="g-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="rgba(245,216,120,0)"/>
      <stop offset="15%"  stop-color="rgba(245,216,120,0.7)"/>
      <stop offset="50%"  stop-color="rgba(255,235,180,1)"/>
      <stop offset="85%"  stop-color="rgba(126,184,212,0.7)"/>
      <stop offset="100%" stop-color="rgba(126,184,212,0)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 上下のロング装飾ライン -->
  <line x1="100" y1="38" x2="1100" y2="38" stroke="url(#g-line)" stroke-width="1.5"/>
  <line x1="100" y1="232" x2="1100" y2="232" stroke="url(#g-line)" stroke-width="1.5"/>

  <!-- 端の装飾ダイヤ -->
  <g transform="translate(100, 38)" fill="#f5d878"><polygon points="0,-4 4,0 0,4 -4,0"/></g>
  <g transform="translate(1100, 38)" fill="#7eb8d4"><polygon points="0,-4 4,0 0,4 -4,0"/></g>
  <g transform="translate(100, 232)" fill="#f5d878"><polygon points="0,-4 4,0 0,4 -4,0"/></g>
  <g transform="translate(1100, 232)" fill="#7eb8d4"><polygon points="0,-4 4,0 0,4 -4,0"/></g>

  <!-- 中央メインタイトル EORZEA -->
  <text x="600" y="125" text-anchor="middle" class="title"
        fill="url(#g-text)" letter-spacing="0.14em" filter="url(#glow)">EORZEA</text>

  <!-- セパレータ ✦ ✦ -->
  <text x="380" y="175" text-anchor="middle" font-size="16" fill="#e8c478" opacity="0.75">✦</text>
  <text x="820" y="175" text-anchor="middle" font-size="16" fill="#e8c478" opacity="0.75">✦</text>

  <!-- 日本語サブタイトル -->
  <text x="600" y="178" text-anchor="middle" class="sub-ja" fill="#f0d68e">攻 略 ガ イ ド</text>

  <!-- 英語サブコピー -->
  <text x="600" y="210" text-anchor="middle" class="sub-en" fill="#b8c8d8" opacity="0.85">
    — Adventures and Discoveries in Eorzea —
  </text>
</svg>
